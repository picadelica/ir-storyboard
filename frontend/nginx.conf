server {
  listen 80;
  server_name _;

  client_max_body_size 50M;

  root /usr/share/nginx/html;
  index index.html;

  location = / {
    return 302 /studio/;
  }

  location = /studio {
    return 302 /studio/;
  }

  location = /classic {
    return 302 /classic/;
  }

  # Backward compatibility for older direct links.
  location /clients/ {
    return 302 /studio$request_uri;
  }

  # Studio SPA — updated design/UX path
  location /studio/ {
    try_files $uri $uri/ /studio/index.html;
  }

  # Classic SPA — upstream-compatible interface
  location /classic/ {
    try_files $uri $uri/ /classic/index.html;
  }

  # Proxy /api/* to the FastAPI backend container
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # YouTube ingest: transcription can take 10-40 min on CPU
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    client_max_body_size 50M;
  }

  # Static asset caching
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
