    flag: green
    channel: online_research
    source_url: https://medium.com/@BitfuryGeorge/gonka-why-i-believe-this-is-the-bitcoin-of-ai-fa702db742d9
    source_title: "Medium / George Kikvadze — capacity report"
    evidence_snippet: >
      By December 2025 Gonka's resources exceeded the equivalent of 6,000 NVIDIA
