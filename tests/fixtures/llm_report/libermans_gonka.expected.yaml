  # ---------- L5 — Clients / Stories ----------
  - subsection_id: "5.1"
    text: >
      К декабрю 2025 в сети 2 200+ разработчиков; целевой клиент — команда,
      запускающая инференс открытых LLM на децентрализованной инфраструктуре.
    flag: green
    channel: online_research
    source_url: https://medium.com/@BitfuryGeorge/gonka-why-i-believe-this-is-the-bitcoin-of-ai-fa702db742d9
    source_title: "Medium / George Kikvadze — Gonka is the Bitcoin of AI"
    evidence_snippet: >
      As of December 2025 Gonka serves over 2,200 developers and 448+ active
      hosts, processing inference for open-weight LLMs that previously would
      have required cloud-tier capacity.

  - subsection_id: "5.2"
    text: >
      Точка перехода клиентов — OpenAI-compatible API: миграция без переписывания
