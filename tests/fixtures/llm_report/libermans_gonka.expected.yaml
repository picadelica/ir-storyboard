    flag: green
    channel: online_interview
    source_url: https://www.binance.com/en/square/post/32276709244242
    source_title: "CoinRank on Binance Square — Gonka roadmap"
    evidence_snippet: >
      In the next two to three months the team plans to launch one-click mining
      and confidential compute, then pursue GNK listings on major exchanges to
      broaden liquidity.

  # ---------- L7 — Social Impact Vision ----------
  - subsection_id: "7.1"
    text: >
      Декларируемая миссия — "разрушить монополию облаков" и обеспечить
      демократичный доступ к AI-вычислениям; любой владелец GPU может
