    flag: green
    channel: online_interview
    source_url: https://www.binance.com/en/square/post/32276709244242
    source_title: "CoinRank on Binance Square — cooperation stance"
    evidence_snippet: >
      The founders explicitly say they do not view other decentralized-AI
      projects as competitors but as fellow participants in a movement to
      democratize compute.

  - subsection_id: "7.3"
    text: >
      Внешнее позиционирование (Bitfury / George Kikvadze): Gonka — "Bitcoin для
      AI". Это амбиция legacy-уровня — стать базовым слоем децентрализованного
      AI-compute.
    flag: green
    channel: online_research
    source_url: https://medium.com/@BitfuryGeorge/gonka-why-i-believe-this-is-the-bitcoin-of-ai-fa702db742d9
    source_title: "Medium / George Kikvadze — Bitcoin-of-AI thesis"
    evidence_snippet: >
      I believe Gonka is the Bitcoin of AI — a neutral, community-owned base
      layer for compute, exactly the kind of infrastructure the AI economy is
      missing today.

  # ---------- L8 — PEST Context ----------
  - subsection_id: "8.1"
    text: >
      Bitfury стартовал $1B фонд этичных технологий — Gonka стала первой и
      крупнейшей инвестицией этого фонда ($50M, ноябрь-декабрь 2025).
    flag: green
    channel: archival
    source_url: https://www.businesswire.com/news/home/20251201364475/en/Bitfury-Announces-%2450-Million-Investment-in-Gonka%E2%80%94a-Decentralized-Network-for-Highefficiency-AI-Compute
    source_title: "Bitfury — $50M Investment in Gonka (press release)"
    evidence_snippet: >
      Gonka is the first deployment of Bitfury's newly announced $1 billion
      fund for ethical technology, with $50 million committed across two
      tranches in late November and early December 2025.

  - subsection_id: "8.2"
    text: >
      Конкурентная среда: Bittensor (>12K GPU, фокус на collaboration моделей),
      Render Network ($30M раунд 2024, визуальные вычисления), Aethir (Q3 2025
      revenue $39.8M, ARR $147M, enterprise GPU), Cocoon/Toncoin (Telegram,
      privacy, ранняя стадия).
    flag: green
    channel: online_research
    source_url: https://www.odaily.news/en/post/5207968
    source_title: "Odaily — competitive landscape of decentralized AI compute"
    evidence_snippet: >
      Compared with Bittensor (>12,000 GPUs, model collaboration), Render (raised
      $30M in 2024 for visual compute), Aethir (enterprise GPU containers, $39.8M
      Q3 2025 revenue and $147M ARR) and Cocoon (Telegram-native, privacy-first,
      early stage), Gonka focuses on AI inference and broad GPU participation.

  - subsection_id: "8.3"
    text: >
      Регуляторные риски DePIN/AI (securities-классификация GNK, экспортный
      контроль на AI-инфраструктуру, KYC для майнеров) в отчёте не покрыты.
      Серое поле — open research target.
    flag: grey
    channel: online_research
    source_url: https://cryptobriefing.com/gonka-decentralized-ai-compute-launch/
    source_title: "Crypto Briefing — regulatory angle not covered"
    evidence_snippet: >
      The launch coverage does not address how regulators in the U.S., EU or
      Asia might classify GNK or treat decentralized AI compute under
      AI-specific or securities frameworks.

