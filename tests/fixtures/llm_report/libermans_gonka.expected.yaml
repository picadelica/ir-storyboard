# ---------------- Facts ----------------
# Каждый факт привязан к source_url (одному из ниже), снабжён flag и
# evidence_snippet. Канал выбран строго из 4 канонических.

seed_facts:

  # ---------- L2 — Founder Professional Story ----------
  - subsection_id: "2.1"
    text: >
      Братья Либерман выстроили путь из distributed-computing и AR-стартапов в
      ML-консалтинг: Product Science (2016+) обслуживала Walmart, JP Morgan и
      Airbnb — это и есть основание их экспертизы для Gonka.
    flag: green
    channel: online_interview
    source_url: https://u.today/interviews/50-million-fundraising-chatgpt-competition-and-decentralized-ai-major-interview-with-gonka-founders-1
    source_title: "U.Today — major interview with Gonka founders"
    evidence_snippet: >
      Their experience includes distributed computing, computer graphics and game
      development, which later evolved into augmented-reality products and
      infrastructure-performance optimization (Product Science with Walmart, JP
      Morgan Chase and Airbnb).

  - subsection_id: "2.1"
    text: >
      Gonka инкубирован внутри Product Science в 2024 г. как совместная инициатива
      web2-учёных и Web3-операторов; mainnet запущен в августе 2025.
    flag: green
    channel: archival
    source_url: https://www.businesswire.com/news/home/20251201364475/en/Bitfury-Announces-%2450-Million-Investment-in-Gonka%E2%80%94a-Decentralized-Network-for-Highefficiency-AI-Compute
    source_title: "Bitfury — $50M Investment in Gonka (press release)"
    evidence_snippet: >
      Gonka launched in August 2025 as a decentralized network for high-efficiency
      AI compute, incubated by Product Science before control was handed over to
      the on-chain community.

  - subsection_id: "2.3"
    text: >
      Product Science основана четырьмя братьями и сёстрами Либерман — Анной,
      Давидом, Даниилом и Марией. Это и команда Gonka.
    flag: green
    channel: archival
    source_url: https://www.businesswire.com/news/home/20251201364475/en/Bitfury-Announces-%2450-Million-Investment-in-Gonka%E2%80%94a-Decentralized-Network-for-Highefficiency-AI-Compute
    source_title: "Bitfury — $50M Investment in Gonka (press release)"
    evidence_snippet: >
      Product Science was co-founded by four Liberman siblings — Anna, David,
      Daniil and Maria — and previously raised funding from Coatue Management,
      Slow Ventures and K5.

  - subsection_id: "2.2"
    text: >
      После запуска основатели передали контроль над сетью сообществу: структура
      проекта исключает единоличное влияние любого основателя, инвестора или
      компании.
    flag: green
    channel: online_research
    source_url: https://www.libermans.co/press/forbes
    source_title: "Libermans Co. (repost Forbes) — Gonka governance"
    evidence_snippet: >
      Although Gonka was originally built by Product Science, control of the
      network has been transferred to its users; no single founder, investor or
      company can unilaterally influence its development.

  # ---------- L3 — Community Culture (фрагментарно, через интервью) ----------
  - subsection_id: "3.3"
    text: >
      Раунд: $50M от Bitfury в первой сделке $1B этического фонда. Дополнительный
      слой инвесторов — Coatue, Slow Ventures, K5 (Product Science, 2023) и
