    flag: grey
    channel: online_research
    source_url: https://medium.com/@BitfuryGeorge/gonka-why-i-believe-this-is-the-bitcoin-of-ai-fa702db742d9
    source_title: "Medium / George Kikvadze — no named-client cases"
    evidence_snippet: >
      The post discusses aggregate metrics (developers, hosts, inference jobs)
      but does not name individual customers, their challenges or specific
