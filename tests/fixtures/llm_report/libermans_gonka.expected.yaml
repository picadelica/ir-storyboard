  # ---------- L6 — Product & Business ----------
  - subsection_id: "6.1"
    text: >
      Proof-of-Work 2.0 (Sprint consensus): майнеры выполняют реальные задачи AI
      — инференс и обучение моделей — вместо вычисления хешей; ~100% GPU-цикла
      направлены на продуктивную работу.
    flag: green
    channel: online_research
    source_url: https://cryptobriefing.com/gonka-decentralized-ai-compute-launch/
    source_title: "Crypto Briefing — Gonka launch coverage"
    evidence_snippet: >
      Unlike traditional Proof-of-Work, Gonka's Sprint consensus channels nearly
      100% of GPU cycles toward productive AI inference and training instead of
      meaningless hash computation.

  - subsection_id: "6.1"
    text: >
      Архитектура отказывается от стейкинга и делегирования; всё управление —
      on-chain голосование, чтобы предотвратить концентрацию власти.
    flag: green
    channel: online_research
    source_url: https://www.libermans.co/press/forbes
    source_title: "Libermans Co. (repost Forbes) — Gonka governance"
    evidence_snippet: >
      To ensure fair participation the protocol drops staking and delegation
      mechanisms; almost all governance is exercised through on-chain votes to
      prevent concentration of power.

  - subsection_id: "6.2"
    text: >
      Grace period — 180 эпох (~6 мес): бесплатный инференс плюс ежедневное
      распределение GNK активным участникам. Это сознательный subsidy на
