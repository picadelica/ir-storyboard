    flag: green
    channel: online_research
    source_url: https://cryptobriefing.com/gonka-decentralized-ai-compute-launch/
    source_title: "Crypto Briefing — Gonka launch coverage"
    evidence_snippet: >
      For the first 180 epochs (roughly six months) inference on Gonka is free,
      and GNK tokens are distributed daily to active participants of the
      network.

  - subsection_id: "6.2"
    text: >
      Управление децентрализовано принципиально: фонд не создан, ни один игрок
      не может единолично влиять на развитие. 12% всего предложения (120M GNK)
