      Libermans Co).
    flag: green
    channel: online_research
    source_url: https://www.odaily.news/en/post/5207968
    source_title: "Odaily — Bitfury invests $50M in Gonka"
    evidence_snippet: >
      Bitfury, the mining giant, committed $50 million to Gonka in late 2025;
      earlier, Product Science raised $18M at a $200M valuation led by Coatue,
      Slow Ventures and K5, with backing from Andreessen, Dixon and Kushner.

  # ---------- L4 — Community Professional Experience ----------
  - subsection_id: "4.1"
    text: >
      Команда — гибрид: web2-учёные (ML, оптимизация инфраструктуры) и операторы
      Web3-инфраструктуры. Это методологическая особенность Gonka относительно
      "чисто-крипто" DePIN-проектов.
    flag: green
    channel: online_interview
    source_url: https://u.today/interviews/50-million-fundraising-chatgpt-competition-and-decentralized-ai-major-interview-with-gonka-founders-1
    source_title: "U.Today — major interview with Gonka founders"
    evidence_snippet: >
      Gonka is the result of a collaboration between web2 scientists and Web3
      infrastructure operators — a deliberate fusion the founders see as the
      protocol's main competitive edge.

  - subsection_id: "4.2"
    text: >
      Сеть выросла в 16 раз за 2 месяца после запуска; объявленные цели — 10K
      H100-экв., затем 100K GPU, что сделает Gonka одним из крупнейших игроков
      AI-инфраструктуры.
    flag: green
    channel: online_interview
    source_url: https://www.binance.com/en/square/post/32276709244242
    source_title: "CoinRank on Binance Square — Gonka roadmap"
    evidence_snippet: >
      The network has grown 16x in two months and is targeting 10,000 GPUs in
      the short term and 100,000 GPUs longer term, the team told CoinRank.

  - subsection_id: "4.3"
    text: >
      Публичных описаний коллективных провалов команды (Product Science или
