    flag: green
    channel: archival
    source_url: https://www.businesswire.com/news/home/20251201364475/en/Bitfury-Announces-%2450-Million-Investment-in-Gonka%E2%80%94a-Decentralized-Network-for-Highefficiency-AI-Compute
    source_title: "Bitfury — $50M Investment in Gonka (press release)"
    evidence_snippet: >
      Gonka was "fairly launched" with no foundation in control; 120 million GNK
      (12% of supply) was allocated to the community pool, and the sale of 12
      million GNK to Bitfury was approved via on-chain vote.

  - subsection_id: "6.3"
    text: >
      Капасити: 6 000 H100-экв. к декабрю 2025 (Medium/Bitfury), 10 000 (Product
      Science), 12 000+ (U.Today, январь 2026) — система растёт быстрее, чем
