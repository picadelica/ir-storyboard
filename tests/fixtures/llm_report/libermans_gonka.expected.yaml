    flag: green
    channel: online_research
    source_url: https://cryptobriefing.com/gonka-decentralized-ai-compute-launch/
    source_title: "Crypto Briefing — Gonka launch coverage"
    evidence_snippet: >
      The project frames itself as an alternative to centralized cloud
      providers, opening compute capacity to anyone with a GPU and paying them
      in GNK tokens for productive work.

  - subsection_id: "7.2"
    text: >
      Основатели публично декларируют кооперацию с другими DePIN-сетями
      (Bittensor, Render, Aethir) и не считают их конкурентами. Цена этой
