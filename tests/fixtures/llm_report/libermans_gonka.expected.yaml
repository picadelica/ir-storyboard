  sector: decentralized AI compute / DePIN
  one_liner: >
    Family founder cluster (Liberman) building Gonka — community-owned PoW-2.0
    network for AI inference, validated by $50M Bitfury investment (Dec 2025).
founder_name: David & Daniil Liberman
founder_handle: daniilliberman
aliases:
  - Libermans Co
  - Liberman brothers
  - Product Science
  - Gonka Protocol
initial_quarter: 2026Q2
seed_tracks:
  - name: "Bitcoin-of-AI thesis"
    angle: >
      Семья Либерман конвертирует капитал и сеть (Snapchat, Product Science,
      $400M-оценочный Libermans Co) в первый community-owned AI-compute протокол.
      $50M от Bitfury в первой сделке $1B этического фонда — институциональная
      валидация тезиса "Bitcoin для AI".
    target_layer_ids: [2, 6, 8]
    target_subsection_ids: ["2.1", "2.3", "6.1", "6.2", "8.1", "8.2"]
    priority: 1
  - name: "Community-owned governance"
    angle: >
      Управление передано сообществу: нет фонда, нет делегирования, нет стейкинга.
      Это и философия продукта (6.2), и социальная миссия (7.1), и потенциальный
      регуляторный риск (8.3).
    target_layer_ids: [6, 7, 8]
    target_subsection_ids: ["6.2", "7.1", "8.3"]
